<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        label {
            display: inline-block;
            width: 100px;
        }
        body {
            margin: 20px;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <form>
        <fieldset style="width: 300px; height: 190px; background-color: lightblue; border: 2px solid black; border-radius: 10px;">
            <legend><strong>Personal Information</strong></legend>
           <label for="name">Name:</label> <input type="text" name="name" id="name" placeholder="Enter your name"><br>
           <label for="fname">Father's Name:</label> <input type="text" name="fname" id="fname" placeholder="Enter your father name"><br>
           <label for="age">Age:</label> <input type="number" name="age" id="age" placeholder="Enter your age"><br>
           <label for="email">Email:</label> <input type="email" name="email" id="email" placeholder="Enter your email">
            <br>
            <br>
            <br>

             <input type="submit" value="Submit">

        </fieldset>
        <br>
        <br>
</body>
</html>
